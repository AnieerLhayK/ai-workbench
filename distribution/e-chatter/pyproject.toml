[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "e-chatter"
version = "0.2.0-rc.2"
description = "Independent Windows character conversation and revision application"
requires-python = ">=3.13"
dependencies = ["PySide6==6.9.2", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyInstaller==6.22.3"]

[project.scripts]
e-chatter = "ai_workbench.e_chatter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_workbench.e_chatter" = ["resources/**/*", "web/**/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
