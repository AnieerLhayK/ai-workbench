[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workbench"
version = "0.5.0"
description = "Native helper workbench with local controls, project terminals and approved offline experiments"
requires-python = ">=3.13"
dependencies = ["PySide6==6.9.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ai-workbench = "ai_workbench.app:main"
experiment-box = "ai_workbench.experiment_box.app:main"
e-diary = "ai_workbench.e_diary.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_workbench = ["assets/*.svg", "assets/*.ico"]
"ai_workbench.experiment_box" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
