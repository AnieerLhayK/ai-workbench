[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workbench"
version = "0.2.0"
description = "Personal helper workbench with local Commander and Hermes controls"
requires-python = ">=3.13"
dependencies = ["PySide6==6.9.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ai-workbench = "ai_workbench.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_workbench = ["assets/*.svg", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
